<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">
  <!--
    Belgrade -> Palma de Mallorca, issue #215.

    Hand-drawn line art, not a photograph: a photograph would be somebody
    else's copyright, and the whole reason deploy/catalogue.json's image_url
    is root-relative is that nothing here depends on a host this project does
    not control.

    Every colour below is one of the seven tokens frontend/src/styles.css
    declares (light theme values), copied as a literal hex rather than left
    as a stylesheet reference: this file is loaded through an img tag, and a
    document reached that way is isolated from the page's stylesheet, so a
    custom property here would simply fail to resolve. architecture.test.ts's
    "no colour literal reaches a component" rule scopes only the source files
    under src that import.meta.glob reads, so a literal in a static asset
    under public is not something that guard was ever asked to see, and
    nothing here names an eighth colour.
      paper  #f7f2e8   card fill, unused here
      wash   #e8dfcc   card background
      ink    #10243a   linework
      signal #1f5fbf   the flight path
  -->
  <title>Line illustration of a flight route, from a dot to a dot</title>
  <rect x="6" y="6" width="188" height="188" rx="20" fill="#e8dfcc" stroke="#10243a" stroke-width="3"/>

  <circle cx="42" cy="162" r="6" fill="#10243a"/>
  <circle cx="164" cy="40" r="6" fill="#10243a"/>

  <g transform="translate(95,100) rotate(48)">
    <line x1="0" y1="8" x2="0" y2="76" stroke="#1f5fbf" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="2 15"/>
    <path d="M0,-30 L20,20 L0,8 L-20,20 Z" fill="#10243a"/>
  </g>
</svg>
