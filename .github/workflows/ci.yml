name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Generated code is not committed, so a stale copy is not something a
      # diff against the repository can find. Generation itself is what is
      # checked: that the schemas still generate, that a second run produces
      # byte-identical output, and that neither generator touched a tracked
      # file or wrote somewhere .gitignore does not cover.
      - name: Generation is reproducible and self-contained
        run: make generate-verify

      - name: Generated Go compiles
        working-directory: backend
        run: go build ./...

      # The other half of the same check. The frontend imports the generated
      # canonical types, so type-checking it is what proves a schema change
      # reached TypeScript intact — a Go-only build would let the two languages
      # drift for as long as nobody opened the app.
      - name: Frontend type-checks and builds
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Here rather than in a job of its own, because the install above is what
      # it needs and a fourth job would repeat it to run a suite that takes a
      # second. This is the only place the frontend tests run before a merge:
      # `make check` is Go-only on purpose, so nothing local is obliged to have
      # npm, and that obligation has to land somewhere.
      - name: Frontend tests
        working-directory: frontend
        run: npm test

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # backend/internal/core/generated/ is gitignored, so a fresh checkout
      # does not have it. Anything that imports a canonical type needs this
      # step to have run first.
      - name: Generate
        run: make generate

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Test
        working-directory: backend
        run: go test -race ./...

      # The step above already ran every one of these. This runs them again
      # under the name that says what they are, and that is the whole of what
      # it buys — a suite whose result is only visible as "everything passed"
      # is one nobody outside this repository can point at, and pointing at it
      # is the deliverable: the audience is somebody implementing AP2 against
      # ours, asking what our verifier refuses and what it calls each refusal.
      #
      # Here rather than in Lint or Contracts because it is a test run and
      # needs the same `make generate` this job has already done; a job of its
      # own would repeat that to re-run a suite that takes under a second.
      # `make vectors` runs from the repository root and does its own cd, so it
      # takes no working-directory. It is not raced — `go test -race ./...`
      # above is where that coverage comes from — and it is -v, so the log is
      # a list of every vector by name.
      - name: Conformance vectors
        run: make vectors

      - name: Test contracts tooling
        working-directory: contracts/tools
        run: go test ./...

      # The catalogue generator, and the one step that keeps deploy/catalogue.json
      # honest. `make catalogue` is run by a person and by nothing here — a build
      # that regenerated it would make the committed file unfalsifiable — so what
      # runs instead is the suite that re-derives it and compares. A hand-edited
      # derived row, or a change to the derivation that nobody re-ran, fails here.
      - name: Test catalogue generator
        working-directory: tools/catalogue
        run: go test ./...

      # The suite over .githooks/ and over the tracked sentinel in the generated
      # package. CI never runs the hooks themselves — actions/checkout clones,
      # config is not cloned, so core.hooksPath is unset and no hook in this
      # repository can fire on a runner. That is exactly why the suite has to be
      # here: nothing else on the way to a merge exercises them.
      #
      # -count=1 because the subject is four shell scripts and one Go file
      # outside the module, and `go test` reported (cached) after one of the
      # hooks had been deleted from the tree.
      - name: Test bootstrap machinery
        working-directory: tools/bootstrap
        run: go test -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Generate
        run: make generate

      # Includes the depguard rules that keep core/ free of adapters/ and the
      # two protocol adapters free of each other. A failure here is an
      # architecture violation, not a style nit.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.3
          working-directory: backend

  setup:
    name: Fresh clone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # No `make generate` before this, deliberately: the other three jobs
      # generate first and therefore can never see what a new contributor sees.
      # NPM points at a command that does not exist, because every runner ships
      # npm and absence can never be the check — `make setup` is Go-only, and
      # this is what holds it there.
      - name: Setup
        run: make setup NPM=npm-must-not-run

      # vet rather than build: the mocks are _test.go, so `go build ./...` is
      # clean with every one of them missing and would pass the mutation this
      # job exists to catch. GOWORK=off because `make setup` wrote a go.work and
      # this step is not running through make.
      - name: The toolchain loads every package, tests included
        working-directory: backend
        run: GOWORK=off go vet ./...

      # The same property held locally, and the target a contributor can run.
      - name: Setup is complete from nothing, and needs no npm
        run: make setup-verify
