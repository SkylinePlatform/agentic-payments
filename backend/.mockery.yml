# mockery v3 — generated test doubles.
#
# What belongs here is one kind of double: the one a test asserts *about*.
# Recording that a collaborator was called, how often and with what is
# mechanical, and hand-rolling it produces a different recorder every time —
# several of ours also needed their own mutex, because the emitter and the
# idempotency middleware call their collaborators from another goroutine.
#
# What does not belong here is a double that does real work. pkg/sdjwt's
# hmacKey computes a real HMAC-SHA256 and its deterministicSalts is what makes
# a golden vector reproducible; clock.Fake is a driven clock. Replacing any of
# those with a mock returning canned values deletes the thing the test proves.
# See the comments in those files — the absence of a pkg/ entry below is a
# decision, not an omission.
#
# Layout: mockery v3's default, which writes mocks_test.go into the package
# that owns the interface. Nothing new appears in the import graph — an
# external test package (obs_test, transport_test) can name the exported
# identifiers its subject package declares in _test.go files — so the
# dependency rules in .golangci.yml keep meaning exactly what they meant
# before. A shared internal/mocks package would eventually hold a mock of an
# internal/collector interface, and collector-containment would then make the
# whole of it unimportable outside cmd/collector.
all: false
dir: '{{.InterfaceDir}}'
filename: mocks_test.go
force-file-write: true
formatter: goimports
structname: '{{.Mock}}{{.InterfaceName}}'
pkgname: '{{.SrcPackageName}}'
template: testify

packages:
  github.com/SkylinePlatform/agentic-payments/backend/internal/platform/obs:
    interfaces:
      Sink:

  # The watch's Progress port. It is called from the goroutine running the
  # watch, which is the case this file's opening paragraph names as the one
  # hand-rolling gets wrong: testify's own mutex is what makes the recorded
  # calls readable afterwards, and reading them once the watch has finished is
  # what keeps every assertion on the test goroutine.
  github.com/SkylinePlatform/agentic-payments/backend/internal/agent:
    interfaces:
      Progress:

  # The merchant's Processor. What its tests are about is whether the money was
  # asked for at all: the merchant refuses a purchase before initiating payment,
  # and the response shape cannot show that — a refusal omits the payment
  # receipt, so a merchant that called the processor and dropped the answer
  # looks identical from outside. Only a double that counts the call can tell
  # those apart.
  github.com/SkylinePlatform/agentic-payments/backend/internal/roles/merchant:
    interfaces:
      Processor:

  # net/http's own interface, so InterfaceDir is GOROOT and the defaults above
  # cannot apply: both the destination and the package name have to be said
  # out loud. The middleware under test wraps an http.Handler, and what these
  # tests are about is how many times the wrapped handler actually ran.
  net/http:
    config:
      dir: internal/platform/transport
      pkgname: transport
    interfaces:
      Handler:

  # The port the user's key sits behind. What the Trusted Surface's test is
  # about is whether that key was reached at all: POST /authorise/preview
  # renders sentences and returns no mandate, and a response carrying no
  # mandate is not the same claim as no signature having been made. A surface
  # that signed and dropped the result would look identical from outside, so
  # only a double that counts the call can tell the two apart.
  #
  # Redirected to internal/roles/surface the way net/http's Handler is
  # redirected, and for a sharper reason than that one: the default would write
  # mocks_test.go into internal/core/authz, where it is compiled only into that
  # package's own test binary and no surface test could name it. Nothing about
  # core changes — a _test.go file in package surface is not an import of
  # anything by core, and core-isolation still holds.
  github.com/SkylinePlatform/agentic-payments/backend/internal/core/authz:
    config:
      dir: internal/roles/surface
      pkgname: surface
    interfaces:
      Signer:
