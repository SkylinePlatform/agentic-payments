# golangci-lint v2 configuration.
#
# The dependency rules below are the architecture. They are not style
# preferences — every one of them protects a property the README claims.

version: "2"

run:
  timeout: 5m

issues:
  # Report every violation, not just the first one on a line. A depguard hit
  # sharing a line with some other finding is still an architecture breach.
  uniq-by-line: false

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - misspell
    - revive

  settings:
    depguard:
      rules:
        # core/ declares ports and imports nothing else in this module.
        # If the core knows AP2 exists, adding a protocol becomes surgery.
        core-isolation:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/adapters
              desc: core must not know which protocols exist
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/platform
              desc: core defines ports; platform implements them
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/roles
              desc: core must not know about role implementations
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/agent
              desc: core must not depend on the agent
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/pkg
              desc: core is protocol-neutral; httpsig and sd-jwt are wire concerns

        # The two protocol adapters must not grow into each other. Duplication
        # between them is accepted on purpose until a third protocol shows the
        # real seam — see CONTRIBUTING.md.
        adapter-isolation-ap2:
          files:
            - "**/internal/adapters/ap2/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/adapters/tap
              desc: protocol adapters must not depend on each other

        adapter-isolation-tap:
          files:
            - "**/internal/adapters/tap/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/adapters/ap2
              desc: protocol adapters must not depend on each other

        # pkg/ holds standalone implementations of public standards. They must
        # stay liftable out of this repository unchanged.
        pkg-purity:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal
              desc: pkg/ implements public standards and must remain extractable

        # Private keys live in exactly one package. Everything else holds an
        # authz.Signer or an authz.Verifier, which cannot yield key material,
        # and a KeyRef, which is a kid and an algorithm name.
        #
        # This rule is what turns that from a convention into a property: a
        # package that cannot import crypto/ecdsa or crypto/ed25519 cannot name
        # the types a private key would have to arrive in. crypto/rand is
        # deliberately absent from the list — it is the approved randomness
        # source and nonces are needed all over.
        #
        # pkg/ is not exempt. Standalone implementations of public standards
        # take signer and verifier interfaces from their caller; if one ever
        # genuinely needs to parse a key, that is a reviewed exemption, not a
        # quiet import.
        key-material-containment:
          files:
            - $all
            - "!**/internal/platform/crypto/**"
          deny:
            - pkg: crypto/ecdsa
              desc: key material stays in internal/platform/crypto; hold an authz.Signer
            - pkg: crypto/ed25519
              desc: key material stays in internal/platform/crypto; hold an authz.Signer
            - pkg: crypto/rsa
              desc: key material stays in internal/platform/crypto; hold an authz.Signer
            - pkg: crypto/ecdh
              desc: key material stays in internal/platform/crypto; hold an authz.Signer
            - pkg: crypto/x509
              desc: key material stays in internal/platform/crypto; hold an authz.Signer

        # The event log is observability and never evidence. ADR 0003 Decision
        # 4 says a dispute-handling path must have no reason to import or query
        # anything the collector holds, and issue #18's five verification steps
        # read only signed mandates and receipts.
        #
        # This is what turns that sentence into a property. A package that
        # cannot import internal/collector cannot reach for a log entry when a
        # receipt is missing — which is the tempting shortcut, and the one that
        # would quietly weaken the requirement that a rejection must produce a
        # receipt. cmd/collector is the only importer, because it is the process
        # the store exists for.
        collector-containment:
          files:
            - $all
            - "!**/cmd/collector/**"
            - "!**/internal/collector/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/collector
              desc: the event log is observability, never evidence — dispute paths read signed artefacts

        # An agent's view of where its own mandates stand is bookkeeping and
        # never evidence — which is collector-containment's argument, one party
        # along, and this rule is deliberately that rule's exact shape.
        #
        # authz/lifecycle.go says the state is the agent's own and that no
        # verifier can keep it: the rule sets hold no state and each verifier
        # sees one presentation carrying no record of any other. So the state may
        # be served by its owner. What must not happen is a second party reading
        # it: a merchant that could import this package to ask an agent whether
        # its mandate is spent would be reading the buyer's opinion as fact,
        # where AP2 gives it a signed receipt to read instead.
        #
        # cmd/agent is the only importer, because it is the process the console
        # exists for.
        console-containment:
          files:
            - $all
            - "!**/cmd/agent/**"
            - "!**/internal/agent/console/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/agent/console
              desc: a mandate's state is the agent's own bookkeeping, never evidence — verifiers read signed receipts

        # Randomness in this codebase reaches nonces, key material and
        # signatures. There is no benign math/rand call here.
        no-weak-randomness:
          files:
            - $all
          deny:
            - pkg: math/rand
              desc: use crypto/rand — randomness here reaches nonces and keys
            - pkg: math/rand/v2
              desc: use crypto/rand — randomness here reaches nonces and keys

    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: time goes through the injected clock, or signature expiry becomes untestable
        # Nothing in the tree sleeps today. This keeps it that way: a test that
        # sleeps is slow when it passes and flaky when it does not, and every
        # deadline here is either driven by the fake clock or observable on a
        # channel. Enforcing it costs nothing now and everything later.
        - pattern: ^time\.Sleep$
          msg: advance the fake clock or wait on a channel; a sleeping test is a flaky test
        # A limit that reports EOF at its cap hands the caller a shortened
        # document. io.ReadAll over one returns it with no error at all, and
        # json.Decoder over one reports "unexpected EOF" — blaming the sender for a
        # cut this side made. Neither failure sends anybody to the limit, which is
        # issue #251. transport.RefusingOver refuses instead, naming the number.
        #
        # Banned rather than discouraged because #251 removed the last call site,
        # so there is no legitimate instance left to grandfather and the next one
        # would be a reintroduction. forbidigo matches expressions and not
        # comments, so the discussion of io.LimitReader in limit.go's own doc
        # comment does not trip it.
        # The message is quoted, which the two above do not have to be: an
        # unquoted YAML scalar ends at a ` #`, so an issue number written bare is
        # silently dropped and the message stops mid-sentence. Confirmed by
        # reading it back out of a deliberate violation.
        - pattern: ^io\.LimitReader$
          msg: "a limit that reports EOF at its cap hands on a shortened document; use transport.RefusingOver, which refuses — see AGENTS.md and issue #251"

    revive:
      rules:
        - name: package-comments
          disabled: true

  exclusions:
    rules:
      # The clock implementation is the one place allowed to read the wall clock.
      - path: internal/platform/clock/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SkylinePlatform/agentic-payments/backend
