# golangci-lint v2 configuration.
#
# The dependency rules below are the architecture. They are not style
# preferences — every one of them protects a property the README claims.

version: "2"

run:
  timeout: 5m

issues:
  # Report every violation, not just the first one on a line. A depguard hit
  # sharing a line with some other finding is still an architecture breach.
  uniq-by-line: false

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - misspell
    - revive

  settings:
    depguard:
      rules:
        # core/ declares ports and imports nothing else in this module.
        # If the core knows AP2 exists, adding a protocol becomes surgery.
        core-isolation:
          files:
            - "**/internal/core/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/adapters
              desc: core must not know which protocols exist
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/platform
              desc: core defines ports; platform implements them
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/roles
              desc: core must not know about role implementations
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/agent
              desc: core must not depend on the agent
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/pkg
              desc: core is protocol-neutral; httpsig and sd-jwt are wire concerns

        # The two protocol adapters must not grow into each other. Duplication
        # between them is accepted on purpose until a third protocol shows the
        # real seam — see CONTRIBUTING.md.
        adapter-isolation-ap2:
          files:
            - "**/internal/adapters/ap2/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/adapters/tap
              desc: protocol adapters must not depend on each other

        adapter-isolation-tap:
          files:
            - "**/internal/adapters/tap/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal/adapters/ap2
              desc: protocol adapters must not depend on each other

        # pkg/ holds standalone implementations of public standards. They must
        # stay liftable out of this repository unchanged.
        pkg-purity:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/SkylinePlatform/agentic-payments/backend/internal
              desc: pkg/ implements public standards and must remain extractable

        # Private keys live in exactly one package. Everything else holds an
        # authz.Signer or an authz.Verifier, which cannot yield key material,
        # and a KeyRef, which is a kid and an algorithm name.
        #
        # This rule is what turns that from a convention into a property: a
        # package that cannot import crypto/ecdsa or crypto/ed25519 cannot name
        # the types a private key would have to arrive in. crypto/rand is
        # deliberately absent from the list — it is the approved randomness
        # source and nonces are needed all over.
        #
        # pkg/ is not exempt. Standalone implementations of public standards
        # take signer and verifier interfaces from their caller; if one ever
        # genuinely needs to parse a key, that is a reviewed exemption, not a
        # quiet import.
        key-material-containment:
          files:
            - $all
            - "!**/internal/platform/crypto/**"
          deny:
            - pkg: crypto/ecdsa
              desc: key material stays in internal/platform/crypto; hold an authz.Signer
            - pkg: crypto/ed25519
              desc: key material stays in internal/platform/crypto; hold an authz.Signer
            - pkg: crypto/rsa
              desc: key material stays in internal/platform/crypto; hold an authz.Signer
            - pkg: crypto/ecdh
              desc: key material stays in internal/platform/crypto; hold an authz.Signer
            - pkg: crypto/x509
              desc: key material stays in internal/platform/crypto; hold an authz.Signer

        # Randomness in this codebase reaches nonces, key material and
        # signatures. There is no benign math/rand call here.
        no-weak-randomness:
          files:
            - $all
          deny:
            - pkg: math/rand
              desc: use crypto/rand — randomness here reaches nonces and keys
            - pkg: math/rand/v2
              desc: use crypto/rand — randomness here reaches nonces and keys

    forbidigo:
      forbid:
        - pattern: ^time\.Now$
          msg: time goes through the injected clock, or signature expiry becomes untestable

    revive:
      rules:
        - name: package-comments
          disabled: true

  exclusions:
    rules:
      # The clock implementation is the one place allowed to read the wall clock.
      - path: internal/platform/clock/
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/SkylinePlatform/agentic-payments/backend
